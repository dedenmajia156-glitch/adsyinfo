<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengkali KPI — KPI & Gaji System</title>
  <link rel="stylesheet" href="/css/style.css?v=5">
  <script src="/js/config.js?v=5"></script>
  <script src="/js/auth.js?v=5"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebarContainer"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        <div>
          <div class="page-title">Pengkali KPI</div>
          <div class="page-subtitle">Konfigurasi pengkali bonus KPI per jabatan</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="user-badge">&#128100; <span id="topBarUser">...</span></div>
      </div>
    </header>
    <main class="page-content fade-in">

      <div class="alert alert-info mb-6" style="font-size:13px;">
        <strong>Formula Bonus KPI:</strong> Bonus = Pengkali &times; Total Poin &nbsp;&bull;&nbsp;
        <strong>Linear:</strong> Pengkali = Total Poin &divide; Divisor &nbsp;&bull;&nbsp;
        <strong>Range:</strong> Pengkali fix sesuai rentang poin
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <select class="form-control" id="jabatanFilter" style="width:240px;" onchange="loadRules()">
            <option value="">Semua Jabatan</option>
            <option value="global">Default (Global)</option>
          </select>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-primary" onclick="openAddRule()">+ Tambah Rule</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Daftar Pengkali</div>
          <div class="card-subtitle" id="ruleCount">Memuat...</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Jabatan</th>
                <th>Tipe</th>
                <th class="text-right">Range / Divisor</th>
                <th class="text-right">Pengkali</th>
                <th>Label</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="ruleTableBody">
              <tr class="loading-row"><td colspan="6"><div class="spinner spinner-sm" style="margin:auto;"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Modal Add/Edit -->
<div class="modal-overlay" id="modalRule">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalRuleTitle">Tambah Rule Pengkali</div>
      <button class="modal-close" onclick="closeModal('modalRule')">&#10005;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="ruleId">
      <div class="form-group">
        <label class="form-label">Jabatan</label>
        <select class="form-control" id="ruleJabatan">
          <option value="">— Default (berlaku untuk semua jabatan) —</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tipe Pengkali <span class="required">*</span></label>
        <select class="form-control" id="ruleType" onchange="renderRuleFields()">
          <option value="range">Range — pengkali fix berdasarkan rentang poin</option>
          <option value="linear">Linear — pengkali = total poin &divide; divisor</option>
        </select>
      </div>
      <div id="ruleFields"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalRule')">Batal</button>
      <button class="btn btn-primary" onclick="saveRule()">Simpan</button>
    </div>
  </div>
</div>

<script>
let currentEmployee = null;
let jabatanList = [];
let allRules = [];

(async () => {
  currentEmployee = await requireRole(['hr', 'ceo']);
  if (!currentEmployee) return;
  initSidebar(currentEmployee);
  await Promise.all([loadJabatan(), loadRules()]);
})();

async function loadJabatan() {
  try {
    jabatanList = await sbGet('jabatan', '?select=id,nama,divisions(nama)&order=nama', getToken()) || [];
    const filter = document.getElementById('jabatanFilter');
    const modal  = document.getElementById('ruleJabatan');
    jabatanList.forEach(j => {
      const label = `${j.nama} (${j.divisions?.nama || '-'})`;
      filter.add(new Option(label, j.id));
      modal.add(new Option(label, j.id));
    });
  } catch {}
}

async function loadRules() {
  const tbody = document.getElementById('ruleTableBody');
  tbody.innerHTML = '<tr class="loading-row"><td colspan="6"><div class="spinner spinner-sm" style="margin:auto;"></div></td></tr>';

  const filter = document.getElementById('jabatanFilter').value;
  let query = '?select=*,jabatan(nama,divisions(nama))&order=jabatan_id.nullsfirst,type.asc,min_poin.asc';
  if (filter === 'global') query += '&jabatan_id=is.null';
  else if (filter) query += `&jabatan_id=eq.${filter}`;

  try {
    allRules = await sbGet('pengkali_rules', query, getToken()) || [];
    document.getElementById('ruleCount').textContent = `${allRules.length} rule`;
    renderTable();
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="6">${e.message}</td></tr>`;
  }
}

function renderTable() {
  const tbody = document.getElementById('ruleTableBody');
  if (!allRules.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted" style="padding:40px;">Belum ada rule pengkali.</td></tr>';
    return;
  }
  tbody.innerHTML = allRules.map(r => {
    const jabatanLabel = r.jabatan
      ? `<strong>${r.jabatan.nama}</strong> <span class="text-muted text-sm">${r.jabatan.divisions?.nama || ''}</span>`
      : '<span class="badge badge-gray">Default</span>';
    const typeBadge = r.type === 'linear'
      ? '<span class="badge badge-blue">Linear</span>'
      : '<span class="badge badge-green">Range</span>';
    const detail = r.type === 'linear'
      ? `&divide; ${Number(r.divisor).toLocaleString('id')}`
      : `${Number(r.min_poin).toLocaleString('id')} &ndash; ${Number(r.max_poin).toLocaleString('id')}`;
    const pengkaliVal = r.type === 'linear'
      ? `<span class="text-muted text-sm">otomatis</span>`
      : `<strong>${Number(r.pengkali).toLocaleString('id', {maximumFractionDigits:4})}</strong>`;
    return `<tr>
      <td>${jabatanLabel}</td>
      <td>${typeBadge}</td>
      <td class="text-right text-sm">${detail}</td>
      <td class="text-right">${pengkaliVal}</td>
      <td class="text-sm text-muted">${r.label || '—'}</td>
      <td>
        <div class="btn-group">
          <button class="btn btn-sm btn-secondary" onclick="openEditRule(${JSON.stringify(r).replace(/"/g,'&quot;')})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteRule('${r.id}')">Hapus</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderRuleFields() {
  const type = document.getElementById('ruleType').value;
  document.getElementById('ruleFields').innerHTML = type === 'linear' ? `
    <div class="form-row-2">
      <div class="form-group">
        <label class="form-label">Divisor (pembagi) <span class="required">*</span></label>
        <input type="number" class="form-control" id="ruleDivisor" placeholder="Contoh: 10000" min="1">
        <div class="form-hint">Pengkali = Total Poin &divide; Divisor</div>
      </div>
      <div class="form-group">
        <label class="form-label">Label</label>
        <input type="text" class="form-control" id="ruleLabel" placeholder="Contoh: Linear Standard">
      </div>
    </div>` : `
    <div class="form-row-2">
      <div class="form-group">
        <label class="form-label">Poin Minimal <span class="required">*</span></label>
        <input type="number" class="form-control" id="ruleMinPoin" placeholder="Contoh: 50000" min="0">
      </div>
      <div class="form-group">
        <label class="form-label">Poin Maksimal <span class="required">*</span></label>
        <input type="number" class="form-control" id="ruleMaxPoin" placeholder="Contoh: 60000" min="0">
      </div>
    </div>
    <div class="form-row-2">
      <div class="form-group">
        <label class="form-label">Pengkali <span class="required">*</span></label>
        <input type="number" class="form-control" id="rulePengkali" placeholder="Contoh: 5" min="0" step="0.0001">
      </div>
      <div class="form-group">
        <label class="form-label">Label</label>
        <input type="text" class="form-control" id="ruleLabel" placeholder="Contoh: Grade A">
      </div>
    </div>`;
}

function openAddRule() {
  document.getElementById('ruleId').value = '';
  document.getElementById('ruleJabatan').value = '';
  document.getElementById('ruleType').value = 'range';
  document.getElementById('modalRuleTitle').textContent = 'Tambah Rule Pengkali';
  renderRuleFields();
  openModal('modalRule');
}

function openEditRule(r) {
  document.getElementById('ruleId').value = r.id;
  document.getElementById('ruleJabatan').value = r.jabatan_id || '';
  document.getElementById('ruleType').value = r.type || 'range';
  document.getElementById('modalRuleTitle').textContent = 'Edit Rule Pengkali';
  renderRuleFields();
  setTimeout(() => {
    if (r.type === 'linear') {
      if (document.getElementById('ruleDivisor')) document.getElementById('ruleDivisor').value = r.divisor || '';
    } else {
      if (document.getElementById('ruleMinPoin'))  document.getElementById('ruleMinPoin').value  = r.min_poin  || '';
      if (document.getElementById('ruleMaxPoin'))  document.getElementById('ruleMaxPoin').value  = r.max_poin  || '';
      if (document.getElementById('rulePengkali')) document.getElementById('rulePengkali').value = r.pengkali  || '';
    }
    if (document.getElementById('ruleLabel')) document.getElementById('ruleLabel').value = r.label || '';
  }, 50);
  openModal('modalRule');
}

async function saveRule() {
  const id      = document.getElementById('ruleId').value;
  const type    = document.getElementById('ruleType').value;
  const jabId   = document.getElementById('ruleJabatan').value || null;
  const label   = document.getElementById('ruleLabel')?.value.trim() || '';
  const data    = { type, jabatan_id: jabId, label };

  if (type === 'linear') {
    const divisor = Number(document.getElementById('ruleDivisor')?.value);
    if (!divisor) { showToast('Divisor wajib diisi.', 'error'); return; }
    Object.assign(data, { divisor, min_poin: null, max_poin: null, pengkali: null });
  } else {
    const min      = Number(document.getElementById('ruleMinPoin')?.value)  || 0;
    const max      = Number(document.getElementById('ruleMaxPoin')?.value)  || 0;
    const pengkali = Number(document.getElementById('rulePengkali')?.value) || 0;
    if (!pengkali) { showToast('Pengkali wajib diisi.', 'error'); return; }
    Object.assign(data, { min_poin: min, max_poin: max, pengkali, divisor: null });
  }

  try {
    if (id) await sbPatch('pengkali_rules', `?id=eq.${id}`, data, getToken());
    else    await sbPost('pengkali_rules', data, getToken());
    showToast('Rule berhasil disimpan.', 'success');
    closeModal('modalRule');
    await loadRules();
  } catch(e) { showToast('Gagal: ' + e.message, 'error'); }
}

async function deleteRule(id) {
  if (!confirm('Hapus rule ini?')) return;
  try {
    await sbDelete('pengkali_rules', `?id=eq.${id}`, getToken());
    showToast('Rule dihapus.', 'success');
    await loadRules();
  } catch(e) { showToast('Gagal: ' + e.message, 'error'); }
}
</script>
</body>
</html>
