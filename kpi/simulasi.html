<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi KPI — KPI & Gaji System</title>
  <link rel="stylesheet" href="/css/style.css?v=5">
  <style>
    /* Scrollable wrapper — sama seperti .bulk-wrap di input-bulk */
    .sim-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .sim-inner { min-width: 480px; }

    .sim-section { background:#fef08a; font-weight:800; font-size:12px; padding:9px 16px; color:#374151; border-bottom:1px solid var(--border); }
    .sim-row { display:grid; grid-template-columns:2fr 60px 90px 100px 100px; gap:4px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--gray-100); font-size:13px; }
    .sim-row.prod-row { padding-left:36px; background:#fafafa; }
    .sim-header { background:var(--gray-50); font-weight:700; font-size:11px; color:var(--gray-500); text-transform:uppercase; letter-spacing:.4px; }

    /* Kolom nama sticky — sama seperti s1 di input-bulk */
    .sim-row > div:first-child { position:sticky; left:0; background:inherit; z-index:2; padding-right:8px; }
    .sim-section { position:sticky; left:0; }

    .sim-inp { width:80px; padding:4px 6px; border:1px solid #93c5fd; border-radius:4px; font-size:12px; text-align:center; }
    .sim-inp:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px rgba(8,145,178,.15); }
    .sim-poin { font-weight:700; text-align:right; padding-right:4px; }
    .sim-pos { color:#15803d; } .sim-neg { color:#b91c1c; } .sim-zer { color:#9ca3af; }
    .sim-summary-row { background:#fef3c7; font-weight:800; border-top:2px solid #374151; }

    .result-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:2px solid var(--border); }
    .result-item { text-align:center; padding:20px 16px; border-right:1px solid var(--border); }
    .result-item:last-child { border-right:none; }
    .result-item .val { font-size:26px; font-weight:900; color:var(--primary); line-height:1; }
    .result-item .val.bonus { color:#059669; font-size:20px; }
    .result-item .lbl { font-size:11px; color:var(--gray-500); margin-top:6px; text-transform:uppercase; letter-spacing:.4px; }
    .result-item .sub { font-size:12px; color:var(--gray-400); margin-top:2px; }

    @media (max-width: 640px) {
      .result-bar { grid-template-columns:1fr; }
      .result-item { border-right:none; border-bottom:1px solid var(--border); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
      .result-item:last-child { border-bottom:none; }
      .result-item .val { font-size:20px; }
      .result-item .lbl { margin-top:0; }
    }
  </style>
  <script src="/js/config.js?v=5"></script>
  <script src="/js/auth.js?v=5"></script>
  <script src="/js/kpi-calc.js?v=5"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebarContainer"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        <div>
          <div class="page-title">Simulasi KPI</div>
          <div class="page-subtitle">Hitung estimasi poin & bonus berdasarkan achieve yang diinput</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="user-badge">&#128100; <span id="topBarUser">...</span></div>
      </div>
    </header>
    <main class="page-content fade-in">

      <div class="card" id="simuCard">
        <div class="card-header">
          <div>
            <div class="card-title" id="simuTitle">Memuat template...</div>
            <div class="card-subtitle" id="simuSubtitle"></div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="resetAll()">&#8635; Reset</button>
        </div>

        <div id="simuContent">
          <div class="empty-state"><div class="spinner"></div></div>
        </div>

        <div class="result-bar" id="simuResult" style="display:none;">
          <div class="result-item">
            <div class="val" id="resTotalPoin">0</div>
            <div class="lbl">Total Poin</div>
          </div>
          <div class="result-item">
            <div class="val" id="resPengkali">0</div>
            <div class="lbl">Pengkali</div>
            <div class="sub" id="resPengkaliLabel"></div>
          </div>
          <div class="result-item">
            <div class="val bonus" id="resBonus">Rp 0</div>
            <div class="lbl">Estimasi Bonus KPI</div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
let currentEmployee = null;
let template        = null;
let products        = [];
let pengkaliRules   = [];
let simData         = {}; // indId_prodId -> achieve value

(async () => {
  currentEmployee = await requireAuth();
  if (!currentEmployee) return;
  initSidebar(currentEmployee);
  await loadSimulasi();
})();

async function loadSimulasi() {
  const jabatanId = currentEmployee.jabatan_id;
  if (!jabatanId) {
    document.getElementById('simuContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#9888;</div><div class="empty-state-title">Jabatan belum diatur</div><div class="empty-state-text">Hubungi HR untuk mengatur jabatan kamu.</div></div>';
    return;
  }

  try {
    // Load template
    const tmplArr = await sbGet('kpi_templates',
      `?select=id,nama,jabatan(nama,divisions(nama)),kpi_sections(id,nama,type,urutan,kpi_indicators(id,nama,type,bobot,point_total,config,urutan))&jabatan_id=eq.${jabatanId}&order=is_active.desc.nullslast,created_at.desc&limit=1`,
      getToken());
    template = tmplArr?.[0];
    if (!template) {
      document.getElementById('simuContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128196;</div><div class="empty-state-title">Belum ada template KPI</div><div class="empty-state-text">Template KPI untuk jabatanmu belum dibuat.</div></div>';
      return;
    }
    template.kpi_sections = (template.kpi_sections||[]).sort((a,b)=>a.urutan-b.urutan);
    template.kpi_sections.forEach(s => s.kpi_indicators=(s.kpi_indicators||[]).sort((a,b)=>a.urutan-b.urutan));

    // Load products + pengkali
    const [prods, rules] = await Promise.all([
      sbGet('products', '?select=*&status=eq.aktif&order=nama', getToken()),
      sbGet('pengkali_rules', '?select=*&order=min_poin.asc', getToken()),
    ]);
    // Map produk sama persis seperti input-bulk (sharedProducts format)
    products = (prods || []).map(p => ({
      id: p.id,
      nama: p.nama,
      unit: p.unit || 'pcs',
      tracehold: p.tracehold || 0,
      target_minimal: p.target_minimal || 0,
      target_botol: p.target_botol || 0,
      target_closing: p.target_closing || 0,
    }));
    pengkaliRules = rules || [];

    // Check if template needs per-product indicators
    const perProdTypes = ['caq','botol','closing','retur'];
    const hasPerProd   = template.kpi_sections.some(s => s.kpi_indicators.some(i => perProdTypes.includes(i.type)));
    if (!hasPerProd) products = [];

    document.getElementById('simuTitle').textContent    = template.nama;
    document.getElementById('simuSubtitle').textContent = `${template.jabatan?.nama||''} · ${template.jabatan?.divisions?.nama||''}`;

    renderSimulasi();
    document.getElementById('simuResult').style.display = '';
    updateResult();
  } catch(e) {
    document.getElementById('simuContent').innerHTML = `<div class="alert alert-error" style="margin:16px;">${e.message}</div>`;
  }
}

function renderSimulasi() {
  let html = `
    <div class="sim-row sim-header">
      <div>Indikator</div>
      <div style="text-align:center;">Bobot</div>
      <div style="text-align:right;">Poin Max</div>
      <div style="text-align:center;">Achieve</div>
      <div style="text-align:right;">Get Poin</div>
    </div>`;

  template.kpi_sections.forEach(section => {
    html += `<div class="sim-section">${section.nama}</div>`;
    section.kpi_indicators.forEach(ind => {
      const isPerProd = ['caq','botol','closing','retur'].includes(ind.type);
      if (isPerProd) {
        html += `<div class="sim-row" style="background:#f0f9ff;">
          <div><strong>${ind.nama}</strong> <span class="text-muted text-sm">— per produk</span></div>
          <div style="text-align:center;">${Number(ind.bobot).toFixed(1)}%</div>
          <div style="text-align:right;">${Number(ind.point_total).toLocaleString('id')}</div>
          <div></div><div></div>
        </div>`;
        products.forEach(p => {
          const key  = `${ind.id}_${p.id}`;
          const val  = simData[key] || '';
          const poin = calcPoin(ind, val, p);
          const cls  = poin>0?'sim-pos':poin<0?'sim-neg':'sim-zer';
          html += `<div class="sim-row prod-row">
            <div>${p.nama} <span class="text-muted text-sm">(${p.unit||'pcs'})</span></div>
            <div></div>
            <div style="text-align:right;font-size:11px;color:var(--gray-400);">${getPoinPerUnit(ind,p)}</div>
            <div style="text-align:center;"><input class="sim-inp" type="number" min="0" value="${val}" oninput="onSimInput('${key}',this.value)" id="inp_${key}"></div>
            <div class="sim-poin ${cls}" id="poin_${key}">${poin!==0?poin.toFixed(0):'—'}</div>
          </div>`;
        });
      } else if (ind.type === 'retur_bonus') {
        const poin = getReturBonus(ind);
        const cls  = poin>0?'sim-pos':'sim-zer';
        html += `<div class="sim-row">
          <div><span style="color:#6b7280;font-size:12px;">&#8627;</span> ${ind.nama} <span class="badge badge-gray" style="font-size:10px;">auto</span></div>
          <div style="text-align:center;">${Number(ind.bobot).toFixed(1)}%</div>
          <div style="text-align:right;">${Number(ind.point_total).toLocaleString('id')}</div>
          <div style="text-align:center;font-size:11px;color:var(--gray-400);">Otomatis</div>
          <div class="sim-poin ${cls}" id="poin_${ind.id}_">${poin.toFixed(0)}</div>
        </div>`;
      } else {
        const key  = `${ind.id}_`;
        const val  = simData[key] || '';
        const poin = calcPoin(ind, val, null);
        const cls  = poin>0?'sim-pos':poin<0?'sim-neg':'sim-zer';
        const hint = getAchHint(ind);
        html += `<div class="sim-row">
          <div><strong>${ind.nama}</strong></div>
          <div style="text-align:center;">${Number(ind.bobot).toFixed(1)}%</div>
          <div style="text-align:right;">${Number(ind.point_total).toLocaleString('id')}</div>
          <div style="text-align:center;">
            ${ind.type==='challenge'
              ? `<select class="sim-inp" oninput="onSimInput('${key}',this.value)" id="inp_${key}">
                  <option value="0" ${!val||val==0?'selected':''}>0</option>
                  <option value="1" ${val==1?'selected':''}>1</option>
                  <option value="2" ${val==2?'selected':''}>2</option>
                  <option value="3" ${val>=3?'selected':''}>3+</option>
                </select>`
              : `<input class="sim-inp" type="number" min="0" value="${val}" placeholder="${hint}" oninput="onSimInput('${key}',this.value)" id="inp_${key}">`}
          </div>
          <div class="sim-poin ${cls}" id="poin_${key}">${poin!==0?poin.toFixed(0):'—'}</div>
        </div>`;
      }
    });
  });

  // Summary row
  const total = calcTotal();
  html += `<div class="sim-row sim-summary-row">
    <div>GRAND TOTAL</div>
    <div style="text-align:center;">100%</div>
    <div style="text-align:right;">100.000</div>
    <div></div>
    <div class="sim-poin ${total>=0?'sim-pos':'sim-neg'}" id="simGrandTotal">${Math.round(total).toLocaleString('id')}</div>
  </div>`;

  document.getElementById('simuContent').innerHTML = `<div class="sim-wrap"><div class="sim-inner">${html}</div></div>`;
}

function onSimInput(key, value) {
  simData[key] = value;

  // Find indicator + product
  const [indId, prodId] = key.split('_');
  let ind = null, prod = null;
  template.kpi_sections.forEach(s => s.kpi_indicators.forEach(i => { if (i.id===indId) ind=i; }));
  if (prodId) prod = products.find(p => p.id===prodId);

  if (ind) {
    const poin = calcPoin(ind, value, prod);
    const el   = document.getElementById(`poin_${key}`);
    if (el) {
      el.textContent = poin!==0 ? poin.toFixed(0) : '—';
      el.className   = `sim-poin ${poin>0?'sim-pos':poin<0?'sim-neg':'sim-zer'}`;
    }
    // Refresh retur bonus jika ada
    if (ind.type==='retur') refreshReturBonus();
  }

  updateResult();
}

function refreshReturBonus() {
  template.kpi_sections.forEach(s => s.kpi_indicators.forEach(ind => {
    if (ind.type==='retur_bonus') {
      const p  = getReturBonus(ind);
      const el = document.getElementById(`poin_${ind.id}_`);
      if (el) { el.textContent = p.toFixed(0); el.className = `sim-poin ${p>0?'sim-pos':'sim-zer'}`; }
    }
  }));
}

function updateResult() {
  const total = calcTotal();
  const jabId = currentEmployee.jabatan_id;
  const jRules = pengkaliRules.filter(r => r.jabatan_id === jabId);
  const rules  = jRules.length ? jRules : pengkaliRules.filter(r => !r.jabatan_id);
  const { pengkali, bonusKPI, ruleLabel } = calcBonus(total, rules);

  const gtEl = document.getElementById('simGrandTotal');
  if (gtEl) { gtEl.textContent = Math.round(total).toLocaleString('id'); gtEl.className = `sim-poin ${total>=0?'sim-pos':'sim-neg'}`; }

  document.getElementById('resTotalPoin').textContent    = Math.round(total).toLocaleString('id');
  document.getElementById('resPengkali').textContent     = pengkali.toFixed(2);
  document.getElementById('resPengkaliLabel').textContent = ruleLabel;
  document.getElementById('resBonus').textContent        = formatRupiah(bonusKPI);
}

function resetAll() {
  simData = {};
  renderSimulasi();
  updateResult();
}

/* ===== Calculations ===== */
function calcPoin(ind, achieve, prod) {
  if (achieve===''||achieve===null||achieve===undefined) return 0;
  const a = Number(achieve);
  const n = products.length || 1;
  switch(ind.type) {
    case 'absensi': { const ppu=ind.config?.point_per_unit||(ind.point_total/30); return KPICalc.calcAbsensi(a,ind.point_total,ppu,5); }
    case 'keterlambatan': return KPICalc.calcKeterlambatan(a,ind.point_total);
    case 'caq':  return prod ? KPICalc.calcCAQ(a,prod.tracehold,prod.target_minimal,ind.point_total,n) : 0;
    case 'botol':   return KPICalc.calcBotol(a,prod?.target_botol||1,ind.point_total);
    case 'closing': return KPICalc.calcClosing(a,prod?.target_closing||1,ind.point_total);
    case 'linear':  return KPICalc.calcLinear(a,100,ind.point_total);
    case 'challenge': return KPICalc.calcChallenge(a,ind.point_total);
    case 'sop': return KPICalc.calcSOP(a/100,ind.point_total,ind.config?.threshold||0.70);
    case 'copyright_video': case 'copyright_lp': case 'copyright_gambar':
      return KPICalc.calcCopyright(a,ind.config?.penalty_per_unit||0);
    case 'retur': return prod ? KPICalc.calcRetur(a,0,prod.target_botol||prod.target_closing||0,ind.point_total,n) : 0;
    default: return 0;
  }
}

function getReturBonus(ind) {
  let hasRetur = false;
  template?.kpi_sections.forEach(s => s.kpi_indicators.forEach(i => {
    if (i.type==='retur') products.forEach(p => {
      if (Number(simData[`${i.id}_${p.id}`]||0)>0) hasRetur=true;
    });
  }));
  return hasRetur ? 0 : Number(ind.point_total);
}

function calcTotal() {
  if (!template) return 0;
  let total = 0;
  template.kpi_sections.forEach(s => s.kpi_indicators.forEach(ind => {
    const isPerProd = ['caq','botol','closing','retur'].includes(ind.type);
    if (isPerProd) {
      products.forEach(p => total += calcPoin(ind, simData[`${ind.id}_${p.id}`]||0, p));
    } else if (ind.type==='retur_bonus') {
      total += getReturBonus(ind);
    } else {
      total += calcPoin(ind, simData[`${ind.id}_`]||0, null);
    }
  }));
  return total;
}

function calcBonus(totalPoin, rules) {
  if (!rules.length) return { pengkali:0, bonusKPI:0, ruleLabel:'Belum ada rule' };
  const linear = rules.find(r => r.type==='linear');
  if (linear) { const p=totalPoin/(Number(linear.divisor)||10000); return {pengkali:p,bonusKPI:p*totalPoin,ruleLabel:linear.label||'Linear'}; }
  const range  = rules.find(r => totalPoin>=Number(r.min_poin)&&totalPoin<=Number(r.max_poin));
  if (range)  { const p=Number(range.pengkali); return {pengkali:p,bonusKPI:p*totalPoin,ruleLabel:range.label||'Range'}; }
  return { pengkali:0, bonusKPI:0, ruleLabel:'Di luar range' };
}

function getAchHint(ind) {
  const map={absensi:'maks hari',keterlambatan:'jml telat',linear:'0–100',sop:'0–100'};
  return map[ind.type]||'';
}

function getPoinPerUnit(ind, prod) {
  if (ind.type==='botol')   return prod.target_botol>0   ? `target: ${Number(prod.target_botol).toLocaleString('id')}` : '—';
  if (ind.type==='closing') return prod.target_closing>0 ? `target: ${Number(prod.target_closing).toLocaleString('id')}` : '—';
  if (ind.type==='caq')     return prod.tracehold>0      ? `trace: ${prod.tracehold}%` : '—';
  return '—';
}
</script>
</body>
</html>
