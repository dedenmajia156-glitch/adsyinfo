<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi KPI — KPI & Gaji System</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* === Tabel sama persis seperti input-bulk === */
    .bulk-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    .bulk-tbl { border-collapse: collapse; font-size: 12px; white-space: nowrap; width: 100%; }
    .bulk-tbl th, .bulk-tbl td { border: 1px solid #d1d5db; padding: 5px 8px; }

    .s0,.s1,.s2,.s3,.s4,.s5,.s6 { position:sticky; z-index:3; background:#fff; }
    .s0 { left:0;    min-width:32px; }
    .s1 { left:32px; min-width:160px; }
    .s2 { min-width:60px; }
    .s3 { min-width:60px; }
    .s4 { min-width:60px; }
    .s5 { min-width:60px; }
    .s6 { min-width:90px; border-right:2px solid #9ca3af !important; }

    .bulk-tbl thead .s0,.bulk-tbl thead .s1,.bulk-tbl thead .s2,
    .bulk-tbl thead .s3,.bulk-tbl thead .s4,.bulk-tbl thead .s5,.bulk-tbl thead .s6 {
      background:#0891b2; color:#fff; font-weight:700; text-align:center; z-index:5;
    }

    .r-section td,
    .r-section .s0,.r-section .s1,.r-section .s2,
    .r-section .s3,.r-section .s4,.r-section .s5,.r-section .s6 {
      background:#fef08a !important; font-weight:800; color:#374151;
    }
    .r-subhdr td,
    .r-subhdr .s0,.r-subhdr .s1,.r-subhdr .s2,
    .r-subhdr .s3,.r-subhdr .s4,.r-subhdr .s5,.r-subhdr .s6 {
      background:#fef9c3 !important; font-weight:600; font-size:11px; color:#6b7280;
    }
    .r-summary td,
    .r-summary .s0,.r-summary .s1,.r-summary .s2,
    .r-summary .s3,.r-summary .s4,.r-summary .s5,.r-summary .s6 {
      background:#fef3c7 !important; font-weight:800; border-top:2px solid #374151;
    }

    .cell-inp input, .cell-inp select {
      width:72px; padding:2px 4px; text-align:center;
      border:1px solid #93c5fd; border-radius:3px; font-size:12px;
    }
    .cell-poin { text-align:right; font-weight:700; font-size:12px; min-width:72px; }
    .poin-pos  { color:#15803d; background:#dcfce7; }
    .poin-neg  { color:#b91c1c; background:#fee2e2; }
    .poin-zer  { color:#9ca3af; }
    .total-poin { font-size:13px; font-weight:900; }

    /* Result bar */
    .result-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:2px solid var(--border); }
    .result-item { text-align:center; padding:20px 16px; border-right:1px solid var(--border); }
    .result-item:last-child { border-right:none; }
    .result-item .val { font-size:26px; font-weight:900; color:var(--primary); line-height:1; }
    .result-item .val.bonus { color:#059669; font-size:20px; }
    .result-item .lbl { font-size:11px; color:var(--gray-500); margin-top:6px; text-transform:uppercase; letter-spacing:.4px; }
    .result-item .sub { font-size:12px; color:var(--gray-400); margin-top:2px; }

    @media (max-width: 640px) {
      .result-bar { grid-template-columns:1fr; }
      .result-item { border-right:none; border-bottom:1px solid var(--border); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
      .result-item:last-child { border-bottom:none; }
      .result-item .val { font-size:20px; }
      .result-item .lbl { margin-top:0; }
    }
  </style>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/kpi-calc.js"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebarContainer"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        <div>
          <div class="page-title">Simulasi KPI</div>
          <div class="page-subtitle">Hitung estimasi poin & bonus berdasarkan achieve yang diinput</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="user-badge">&#128100; <span id="topBarUser">...</span></div>
      </div>
    </header>
    <main class="page-content fade-in">

      <div class="card" id="simuCard">
        <div class="card-header">
          <div>
            <div class="card-title" id="simuTitle">Memuat template...</div>
            <div class="card-subtitle" id="simuSubtitle"></div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="resetAll()">&#8635; Reset</button>
        </div>

        <div id="simuContent">
          <div class="empty-state"><div class="spinner"></div></div>
        </div>

        <div class="result-bar" id="simuResult" style="display:none;">
          <div class="result-item">
            <div class="val" id="resTotalPoin">0</div>
            <div class="lbl">Total Poin</div>
          </div>
          <div class="result-item">
            <div class="val" id="resPengkali">0</div>
            <div class="lbl">Pengkali</div>
            <div class="sub" id="resPengkaliLabel"></div>
          </div>
          <div class="result-item">
            <div class="val bonus" id="resBonus">Rp 0</div>
            <div class="lbl">Estimasi Bonus KPI</div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
let currentEmployee = null;
let template        = null;
let products        = [];
let pengkaliRules   = [];
let simData         = {};

(async () => {
  currentEmployee = await requireAuth();
  if (!currentEmployee) return;
  initSidebar(currentEmployee);
  await loadSimulasi();
})();

async function loadSimulasi() {
  const jabatanId = currentEmployee.jabatan_id;
  if (!jabatanId) {
    document.getElementById('simuContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#9888;</div><div class="empty-state-title">Jabatan belum diatur</div><div class="empty-state-text">Hubungi HR untuk mengatur jabatan kamu.</div></div>';
    return;
  }

  try {
    const tmplArr = await sbGet('kpi_templates',
      `?select=id,nama,jabatan(nama,divisions(nama)),kpi_sections(id,nama,type,urutan,kpi_indicators(id,nama,type,bobot,point_total,config,urutan))&jabatan_id=eq.${jabatanId}&order=is_active.desc.nullslast,created_at.desc&limit=1`,
      getToken());
    template = tmplArr?.[0];
    if (!template) {
      document.getElementById('simuContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128196;</div><div class="empty-state-title">Belum ada template KPI</div><div class="empty-state-text">Template KPI untuk jabatanmu belum dibuat.</div></div>';
      return;
    }
    template.kpi_sections = (template.kpi_sections||[]).sort((a,b)=>a.urutan-b.urutan);
    template.kpi_sections.forEach(s => s.kpi_indicators=(s.kpi_indicators||[]).sort((a,b)=>a.urutan-b.urutan));

    const [prods, rules] = await Promise.all([
      sbGet('products', '?select=*&status=eq.aktif&order=nama', getToken()),
      sbGet('pengkali_rules', '?select=*&order=min_poin.asc', getToken()),
    ]);
    products = (prods || []).map(p => ({
      id: p.id, nama: p.nama, unit: p.unit || 'pcs',
      tracehold: p.tracehold || 0, target_minimal: p.target_minimal || 0,
      target_botol: p.target_botol || 0, target_closing: p.target_closing || 0,
    }));
    pengkaliRules = rules || [];

    const perProdTypes = ['caq','botol','closing','retur'];
    const hasPerProd = template.kpi_sections.some(s => s.kpi_indicators.some(i => perProdTypes.includes(i.type)));
    if (!hasPerProd) products = [];

    document.getElementById('simuTitle').textContent    = template.nama;
    document.getElementById('simuSubtitle').textContent = `${template.jabatan?.nama||''} · ${template.jabatan?.divisions?.nama||''}`;

    renderSimulasi();
    document.getElementById('simuResult').style.display = '';
    updateResult();
  } catch(e) {
    document.getElementById('simuContent').innerHTML = `<div class="alert alert-error" style="margin:16px;">${e.message}</div>`;
  }
}

function renderSimulasi() {
  let head = `<thead>
    <tr>
      <th class="s0">NO</th>
      <th class="s1">ITEM PENILAIAN PERFORMA</th>
      <th class="s2" style="text-align:center;">BOBOT</th>
      <th class="s3" style="text-align:center;">POINT TOTAL</th>
      <th class="s4" style="text-align:center;">POINT ACH</th>
      <th class="s5" style="text-align:center;">TARGET MINIMAL</th>
      <th class="s6" style="text-align:center;">UNIT</th>
      <th style="background:#0891b2;color:#fff;font-weight:700;text-align:center;min-width:80px;">ACHIEVE</th>
      <th style="background:#0891b2;color:#fff;font-weight:700;text-align:center;min-width:80px;">GET POIN</th>
    </tr>
  </thead>`;

  let body = `<tbody>`;
  let indicatorNo = 0;

  template.kpi_sections.forEach(section => {
    body += `<tr class="r-section">
      <td class="s0"></td>
      <td class="s1">${section.nama}</td>
      <td class="s2"></td><td class="s3"></td><td class="s4"></td><td class="s5"></td><td class="s6"></td>
      <td></td><td></td>
    </tr>`;

    section.kpi_indicators.forEach(ind => {
      const isPerProd = ['caq','botol','closing','retur'].includes(ind.type);

      if (isPerProd) {
        indicatorNo++;
        body += `<tr>
          <td class="s0" style="text-align:center;">${indicatorNo}</td>
          <td class="s1"><strong>${ind.nama}</strong></td>
          <td class="s2" style="text-align:center;">${Number(ind.bobot).toFixed(1)}%</td>
          <td class="s3" style="text-align:right;">${Number(ind.point_total).toLocaleString('id')}</td>
          <td class="s4" colspan="2" style="text-align:center;font-size:11px;">Handle Produk: ${products.length}</td>
          <td class="s6"></td>
          <td></td><td></td>
        </tr>`;

        if (ind.type === 'caq' && products.length) {
          body += `<tr class="r-subhdr">
            <td class="s0"></td><td class="s1"></td><td class="s2"></td><td class="s3"></td>
            <td class="s4" style="text-align:center;">Tracehold</td>
            <td class="s5" style="text-align:center;">Target</td>
            <td class="s6"></td>
            <td></td><td></td>
          </tr>`;
        }

        products.forEach(p => {
          const key  = `${ind.id}_${p.id}`;
          const val  = simData[key] || '';
          const poin = calcPoin(ind, val, p);
          const pCls = poin>0?'poin-pos':poin<0?'poin-neg':'poin-zer';
          const target = ind.type==='botol' ? p.target_botol
            : ind.type==='closing' ? p.target_closing
            : ind.type==='retur' ? p.target_botol
            : p.target_minimal;
          const thold = ind.type==='caq' ? (p.tracehold>0?p.tracehold+'%':'—') : '—';
          const tmin  = target > 0 ? Number(target).toLocaleString('id') : '—';
          body += `<tr>
            <td class="s0"></td>
            <td class="s1" style="padding-left:22px;">${p.nama}</td>
            <td class="s2"></td><td class="s3"></td>
            <td class="s4" style="text-align:center;font-size:11px;">${thold}</td>
            <td class="s5" style="text-align:center;font-size:11px;">${tmin}</td>
            <td class="s6" style="text-align:center;">${getUnit(ind.type, p.unit)}</td>
            <td class="cell-inp"><input type="number" min="0" value="${val}" oninput="onSimInput('${key}',this.value)" id="inp_${key}"></td>
            <td class="cell-poin ${pCls}" id="poin_${key}">${poin!==0?poin.toFixed(0):'0'}</td>
          </tr>`;
        });

      } else if (ind.type === 'retur_bonus') {
        const poin = getReturBonus(ind);
        const pCls = poin>0?'poin-pos':'poin-zer';
        body += `<tr>
          <td class="s0"></td>
          <td class="s1" style="color:#6b7280;font-size:11px;">↳ Bonus Retur (otomatis jika total retur = 0)</td>
          <td class="s2" style="text-align:center;">${Number(ind.bobot).toFixed(1)}%</td>
          <td class="s3" style="text-align:right;">${Number(ind.point_total).toLocaleString('id')}</td>
          <td class="s4" style="text-align:center;font-size:11px;">Auto</td>
          <td class="s5"></td><td class="s6"></td>
          <td style="text-align:center;font-size:11px;color:var(--gray-400);">Otomatis</td>
          <td class="cell-poin ${pCls}" id="poin_${ind.id}_">${poin.toFixed(0)}</td>
        </tr>`;

      } else {
        indicatorNo++;
        const key  = `${ind.id}_`;
        const val  = simData[key] || '';
        const poin = calcPoin(ind, val, null);
        const pCls = poin>0?'poin-pos':poin<0?'poin-neg':'poin-zer';
        const hint = getAchHint(ind);
        body += `<tr>
          <td class="s0" style="text-align:center;">${indicatorNo}</td>
          <td class="s1"><strong>${ind.nama}</strong></td>
          <td class="s2" style="text-align:center;">${Number(ind.bobot).toFixed(1)}%</td>
          <td class="s3" style="text-align:right;">${Number(ind.point_total).toLocaleString('id')}</td>
          <td class="s4" style="text-align:center;font-size:11px;">${hint}</td>
          <td class="s5" style="text-align:center;">0</td>
          <td class="s6" style="text-align:center;">${getUnit(ind.type)}</td>
          <td class="cell-inp">
            ${ind.type==='challenge'
              ? `<select oninput="onSimInput('${key}',this.value)" id="inp_${key}">
                  <option value="0" ${!val||val==0?'selected':''}>0</option>
                  <option value="1" ${val==1?'selected':''}>1</option>
                  <option value="2" ${val==2?'selected':''}>2</option>
                  <option value="3" ${val>=3?'selected':''}>3+</option>
                </select>`
              : `<input type="number" min="0" value="${val}" placeholder="${hint}" oninput="onSimInput('${key}',this.value)" id="inp_${key}">`}
          </td>
          <td class="cell-poin ${pCls}" id="poin_${key}">${poin!==0?poin.toFixed(0):'0'}</td>
        </tr>`;
      }
    });
  });

  // Summary
  const total = calcTotal();
  body += `<tr class="r-summary">
    <td class="s0"></td>
    <td class="s1"><strong>GRAND TOTAL</strong></td>
    <td class="s2" style="text-align:center;">100%</td>
    <td class="s3" style="text-align:right;">100.000</td>
    <td class="s4"></td><td class="s5"></td><td class="s6"></td>
    <td></td>
    <td class="cell-poin ${total>=0?'poin-pos':'poin-neg'} total-poin" id="simGrandTotal">${Math.round(total).toLocaleString('id')}</td>
  </tr>`;

  body += `</tbody>`;

  document.getElementById('simuContent').innerHTML = `
    <div class="bulk-wrap">
      <table class="bulk-tbl" id="simTable">${head}${body}</table>
    </div>`;

  recalcStickyLeft();
}

function recalcStickyLeft() {
  requestAnimationFrame(() => {
    const table = document.getElementById('simTable');
    if (!table) return;
    const headerRow = table.querySelector('thead tr:first-child');
    if (!headerRow) return;
    const sClasses = ['s0','s1','s2','s3','s4','s5','s6'];
    let left = 0;
    for (const th of headerRow.children) {
      const sc = [...th.classList].find(c => sClasses.includes(c));
      if (!sc) break;
      table.querySelectorAll(`.${sc}`).forEach(el => { el.style.left = left + 'px'; });
      left += th.offsetWidth;
    }
  });
}

function onSimInput(key, value) {
  simData[key] = value;

  const [indId, prodId] = key.split('_');
  let ind = null, prod = null;
  template.kpi_sections.forEach(s => s.kpi_indicators.forEach(i => { if (i.id===indId) ind=i; }));
  if (prodId) prod = products.find(p => p.id===prodId);

  if (ind) {
    const poin = calcPoin(ind, value, prod);
    const el   = document.getElementById(`poin_${key}`);
    if (el) {
      el.textContent = poin!==0 ? poin.toFixed(0) : '0';
      el.className   = `cell-poin ${poin>0?'poin-pos':poin<0?'poin-neg':'poin-zer'}`;
    }
    if (ind.type==='retur') refreshReturBonus();
  }

  updateResult();
}

function refreshReturBonus() {
  template.kpi_sections.forEach(s => s.kpi_indicators.forEach(ind => {
    if (ind.type==='retur_bonus') {
      const p  = getReturBonus(ind);
      const el = document.getElementById(`poin_${ind.id}_`);
      if (el) { el.textContent = p.toFixed(0); el.className = `cell-poin ${p>0?'poin-pos':'poin-zer'}`; }
    }
  }));
}

function updateResult() {
  const total = calcTotal();
  const jabId = currentEmployee.jabatan_id;
  const jRules = pengkaliRules.filter(r => r.jabatan_id === jabId);
  const rules  = jRules.length ? jRules : pengkaliRules.filter(r => !r.jabatan_id);
  const { pengkali, bonusKPI, ruleLabel } = calcBonus(total, rules);

  const gtEl = document.getElementById('simGrandTotal');
  if (gtEl) { gtEl.textContent = Math.round(total).toLocaleString('id'); gtEl.className = `cell-poin total-poin ${total>=0?'poin-pos':'poin-neg'}`; }

  document.getElementById('resTotalPoin').textContent     = Math.round(total).toLocaleString('id');
  document.getElementById('resPengkali').textContent      = pengkali.toFixed(2);
  document.getElementById('resPengkaliLabel').textContent = ruleLabel;
  document.getElementById('resBonus').textContent         = formatRupiah(bonusKPI);
}

function resetAll() {
  simData = {};
  renderSimulasi();
  updateResult();
}

/* ===== Calculations ===== */
function calcPoin(ind, achieve, prod) {
  if (achieve===''||achieve===null||achieve===undefined) return 0;
  const a = Number(achieve);
  const n = products.length || 1;
  switch(ind.type) {
    case 'absensi': { const ppu=ind.config?.point_per_unit||(ind.point_total/30); return KPICalc.calcAbsensi(a,ind.point_total,ppu,5); }
    case 'keterlambatan': return KPICalc.calcKeterlambatan(a,ind.point_total);
    case 'caq':  return prod ? KPICalc.calcCAQ(a,prod.tracehold,prod.target_minimal,ind.point_total,n) : 0;
    case 'botol':   return KPICalc.calcBotol(a,prod?.target_botol||1,ind.point_total);
    case 'closing': return KPICalc.calcClosing(a,prod?.target_closing||1,ind.point_total);
    case 'linear':  return KPICalc.calcLinear(a,100,ind.point_total);
    case 'challenge': return KPICalc.calcChallenge(a,ind.point_total);
    case 'sop': return KPICalc.calcSOP(a/100,ind.point_total,ind.config?.threshold||0.70);
    case 'copyright_video': case 'copyright_lp': case 'copyright_gambar':
      return KPICalc.calcCopyright(a,ind.config?.penalty_per_unit||0);
    case 'retur': return prod ? KPICalc.calcRetur(a,0,prod.target_botol||prod.target_closing||0,ind.point_total,n) : 0;
    default: return 0;
  }
}

function getReturBonus(ind) {
  let hasRetur = false;
  template?.kpi_sections.forEach(s => s.kpi_indicators.forEach(i => {
    if (i.type==='retur') products.forEach(p => {
      if (Number(simData[`${i.id}_${p.id}`]||0)>0) hasRetur=true;
    });
  }));
  return hasRetur ? 0 : Number(ind.point_total);
}

function calcTotal() {
  if (!template) return 0;
  let total = 0;
  template.kpi_sections.forEach(s => s.kpi_indicators.forEach(ind => {
    const isPerProd = ['caq','botol','closing','retur'].includes(ind.type);
    if (isPerProd) {
      products.forEach(p => total += calcPoin(ind, simData[`${ind.id}_${p.id}`]||0, p));
    } else if (ind.type==='retur_bonus') {
      total += getReturBonus(ind);
    } else {
      total += calcPoin(ind, simData[`${ind.id}_`]||0, null);
    }
  }));
  return total;
}

function calcBonus(totalPoin, rules) {
  if (!rules.length) return { pengkali:0, bonusKPI:0, ruleLabel:'Belum ada rule' };
  const linear = rules.find(r => r.type==='linear');
  if (linear) { const p=totalPoin/(Number(linear.divisor)||10000); return {pengkali:p,bonusKPI:p*totalPoin,ruleLabel:linear.label||'Linear'}; }
  const range  = rules.find(r => totalPoin>=Number(r.min_poin)&&totalPoin<=Number(r.max_poin));
  if (range)  { const p=Number(range.pengkali); return {pengkali:p,bonusKPI:p*totalPoin,ruleLabel:range.label||'Range'}; }
  return { pengkali:0, bonusKPI:0, ruleLabel:'Di luar range' };
}

function getAchHint(ind) {
  const map={absensi:'Maks 5 hari',keterlambatan:'0=full poin',linear:'0–100%',sop:'0–100%'};
  return map[ind.type]||'—';
}

function getUnit(type, unit) {
  const map = { absensi:'HARI', keterlambatan:'TELAT', caq:'Presentase (%)',
    botol: unit||'PCS', closing:'PAKET', linear:'%', challenge:'CHALLENGE/BLN',
    sop:'%', copyright_video:'per video', copyright_lp:'per LP',
    copyright_gambar:'per gambar', retur: unit||'PCS' };
  return map[type] || unit || '—';
}
</script>
</body>
</html>
